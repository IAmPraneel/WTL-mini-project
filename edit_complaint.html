<!DOCTYPE html>
<html>
<head>
    <title>Edit Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2>Edit Complaint #{{ complaint.id }}</h2>
            <form method="post">
                <div class="mb-3">
                    <label>Status</label>
                    <select name="status" class="form-control">
                        <option {% if complaint.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option {% if complaint.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option {% if complaint.status == 'Resolved' %}selected{% endif %}>Resolved</option>
                        <option {% if complaint.status == 'Rejected' %}selected{% endif %}>Rejected</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Admin Comment</label>
                    <textarea name="adminComment" class="form-control" rows="3">{{ complaint.adminComment }}</textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
