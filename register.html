<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2>Register Student</h2>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-danger">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}
            <form method="post">
                <div class="mb-3"><label>Name</label><input type="text" name="name" class="form-control" required></div>
                <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
                <div class="mb-3"><label>Password</label><input type="password" name="password" class="form-control" required></div>
                <div class="mb-3"><label>Hostel Block</label><input type="text" name="hostelBlock" class="form-control" required></div>
                <div class="mb-3"><label>Room Number</label><input type="text" name="roomNumber" class="form-control" required></div>
                <button type="submit" class="btn btn-primary">Register</button>
                <a href="{{ url_for('login') }}" class="btn btn-link">Back to Login</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
